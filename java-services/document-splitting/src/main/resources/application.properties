# Server configuration
server.port=8082
spring.application.name=document-splitting-service

# Logging configuration
logging.level.root=INFO
logging.level.com.ocr.splitting=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=splitting-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ocr.splitting.model

# Kafka topics
kafka.topic.splitting-requests=document-splitting-requests
kafka.topic.splitting-results=document-splitting-results

# Feign client configuration
feign.client.document-classification.url=http://localhost:8083

# File storage configuration
document.storage.base-path=/data/documents
document.storage.split-path=/data/split

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
